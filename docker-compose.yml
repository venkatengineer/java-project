services:
  # MySQL 8.0 Database Service
  mysql:
    image: mysql:8.0
    container_name: exam-mysql
    restart: unless-stopped
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: online_examination_system
      MYSQL_USER: exam_user
      MYSQL_PASSWORD: exam_password
      MYSQL_ROOT_PASSWORD: root_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - exam-network

  # Online Examination Spring Boot Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/online_examination_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: exam_user
      SPRING_DATASOURCE_PASSWORD: exam_password
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8080:8080"
    networks:
      - exam-network

volumes:
  mysql_data:
    driver: local

networks:
  exam-network:
    driver: bridge
