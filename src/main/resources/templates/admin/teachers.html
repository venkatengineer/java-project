<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teachers - Admin Portal</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar('teachers', 'ADMIN')}"></div>

    <div class="app-main">
        <!-- Topbar Fragment -->
        <div th:replace="~{fragments/header :: header('Manage Teachers', 'Faculty directory, instructors & examination examiners')}"></div>

        <div class="app-content">
            <!-- Alerts -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Toolbar -->
            <div class="card-custom mb-4 p-3">
                <div class="row g-3 align-items-center">
                    <div class="col-md-6">
                        <form th:action="@{/admin/teachers}" method="get" class="d-flex gap-2">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0" style="border-color: var(--border-color); border-radius: var(--radius-md) 0 0 var(--radius-md);">
                                    <i class="bi bi-search text-muted"></i>
                                </span>
                                <input type="text" name="search" class="form-control border-start-0 ps-0"
                                       placeholder="Search teacher by name or email..." th:value="${searchQuery}">
                            </div>
                            <button type="submit" class="btn btn-outline-purple">Search</button>
                            <a th:if="${searchQuery != null and !searchQuery.isEmpty()}" th:href="@{/admin/teachers}" class="btn btn-outline-purple">Reset</a>
                        </form>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <button type="button" class="btn btn-primary-purple" data-bs-toggle="modal" data-bs-target="#addTeacherModal">
                            <i class="bi bi-person-plus-fill"></i> Add New Teacher
                        </button>
                    </div>
                </div>
            </div>

            <!-- Teachers List Table -->
            <div class="card-custom">
                <div class="card-header-custom">
                    <div>
                        <h5 class="fw-bold mb-0">Faculty Members</h5>
                        <span class="small text-secondary" th:text="${#lists.size(teachers) + ' instructors registered'}">0 teachers</span>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th>Teacher</th>
                                <th>Email</th>
                                <th>Joined Date</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="teacher : ${teachers}">
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="user-avatar-initials" style="background-color: var(--soft-mint); color: var(--soft-mint-dark);"
                                             th:text="${#strings.substring(teacher.name, 0, 1)}">T</div>
                                        <div>
                                            <div class="fw-bold text-dark" th:text="${teacher.name}">Teacher Name</div>
                                            <span class="badge badge-pill badge-soft-mint">Faculty / Teacher</span>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="text-secondary" th:text="${teacher.email}">teacher@email.com</span>
                                </td>
                                <td class="small text-secondary" th:text="${#temporals.format(teacher.createdAt, 'dd MMM yyyy, HH:mm')}">Date</td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-soft-purple btn-sm"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#editTeacherModal-' + ${teacher.id}">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </button>
                                    <button type="button" class="btn btn-soft-danger btn-sm ms-1"
                                            data-bs-toggle="modal" data-bs-target="#deleteConfirmModal"
                                            th:data-action-url="'/admin/teachers/delete/' + ${teacher.id}"
                                            th:data-item-name="${teacher.name}">
                                        <i class="bi bi-trash3"></i> Delete
                                    </button>

                                    <!-- Edit Teacher Modal -->
                                    <div class="modal fade text-start" th:id="'editTeacherModal-' + ${teacher.id}" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog modal-dialog-centered">
                                            <div class="modal-content">
                                                <form th:action="@{'/admin/teachers/edit/' + ${teacher.id}}" method="post">
                                                    <div class="modal-header">
                                                        <h5 class="modal-title fw-bold">Edit Teacher Information</h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                    </div>
                                                    <div class="modal-body">
                                                        <div class="mb-3">
                                                            <label class="form-label">Full Name & Title</label>
                                                            <input type="text" name="name" class="form-control" th:value="${teacher.name}" required>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label">Email Address</label>
                                                            <input type="email" name="email" class="form-control" th:value="${teacher.email}" required>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label">New Password (leave blank to keep current)</label>
                                                            <input type="password" name="password" class="form-control" placeholder="••••••••">
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer bg-light">
                                                        <button type="button" class="btn btn-outline-purple" data-bs-dismiss="modal">Cancel</button>
                                                        <button type="submit" class="btn btn-primary-purple">Save Changes</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(teachers)}">
                                <td colspan="4" class="text-center py-5 text-muted">
                                    <i class="bi bi-person-workspace fs-2 d-block mb-2"></i>
                                    No teachers found matching your search.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Teacher Modal -->
<div class="modal fade" id="addTeacherModal" tabindex="-1" aria-labelledby="addTeacherModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/admin/teachers/add}" method="post" th:object="${userDto}">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="addTeacherModalLabel">Add New Teacher</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Full Name & Title</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Dr. Jane Smith" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="e.g. jane.smith@exam.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Temporary Password</label>
                        <input type="password" name="password" class="form-control" placeholder="At least 6 characters" value="teacher123" required>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-purple" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-purple">Create Teacher Account</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
