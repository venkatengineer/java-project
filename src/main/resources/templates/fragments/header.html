<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header(pageTitle, pageSubtitle)" class="app-topbar">
    <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle-btn" type="button" aria-label="Toggle navigation">
            <i class="bi bi-list"></i>
        </button>
        <div class="topbar-title">
            <h4 th:text="${pageTitle}">Dashboard</h4>
            <span th:if="${pageSubtitle}" class="text-muted small" th:text="${pageSubtitle}">Overview and statistics</span>
        </div>
    </div>

    <div class="topbar-actions">
        <div class="dropdown">
            <button class="btn btn-outline-purple d-flex align-items-center gap-2 dropdown-toggle py-2 px-3" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="user-avatar-initials" style="width: 28px; height: 28px; font-size: 0.75rem;"
                      th:text="${currentUser != null ? #strings.substring(currentUser.name, 0, 1) : 'U'}">U</span>
                <span class="d-none d-md-inline font-weight-600" th:text="${currentUser != null ? currentUser.name : 'User'}">User</span>
                <span class="badge badge-pill badge-soft-purple ms-1" th:text="${currentUser != null ? currentUser.role : 'GUEST'}">ROLE</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" style="border-radius: var(--radius-md); min-width: 200px;">
                <li class="px-3 py-2 border-bottom">
                    <div class="small fw-bold text-dark" th:text="${currentUser != null ? currentUser.name : ''}">User</div>
                    <div class="small text-muted" th:text="${currentUser != null ? currentUser.username : ''}">user@exam.com</div>
                </li>
                <li>
                    <a class="dropdown-item py-2 d-flex align-items-center gap-2"
                       th:href="${currentUser != null && currentUser.role.name() == 'ADMIN' ? '/admin/profile' : (currentUser != null && currentUser.role.name() == 'TEACHER' ? '/teacher/profile' : '/student/profile')}">
                        <i class="bi bi-person"></i> My Profile
                    </a>
                </li>
                <li><hr class="dropdown-divider my-1"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0 p-0">
                        <button type="submit" class="dropdown-item py-2 text-danger d-flex align-items-center gap-2">
                            <i class="bi bi-box-arrow-right"></i> Sign Out
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>

</body>
</html>
